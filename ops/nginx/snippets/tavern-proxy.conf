# Shared reverse-proxy settings for SillyTavern (127.0.0.1:8000).
# Do not forward IP-identifying headers. ST has forwardedHeaders.xRealIp
# and xForwardedFor enabled; enableForwardedWhitelist is off, so access
# control uses the socket IP, which must remain 127.0.0.1.
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-Real-IP "";
proxy_set_header X-Forwarded-For "";
proxy_set_header CF-Connecting-IP "";
proxy_buffering off;
proxy_request_buffering off;
proxy_connect_timeout 60s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;
